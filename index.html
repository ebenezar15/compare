<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Theology Compass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interactive study of ten Western doctrines: their roots, history, key scriptures, pagan and cultural influences, church fathers, contradictions, and answers from relational, Christus Victor, universal reconciliation and victorious-eschatology views.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=Spectral:ital,wght@0,400;1,400&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!--APP-->
<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="var(--accent)" stroke-width="2.5"/><path d="M16 5 L19 16 L16 27 L13 16 Z" fill="var(--gold)"/><path d="M5 16 L16 13 L27 16 L16 19 Z" fill="var(--accent)"/></svg>
      Theology Compass
    </div>
    <nav class="tabs" aria-label="Views">
      <button class="tab" type="button" data-view="overview">Overview</button>
      <button class="tab" type="button" data-view="explorer">Doctrines</button>
      <button class="tab" type="button" data-view="map">Influence map</button>
      <button class="tab" type="button" data-view="timeline">Timeline</button>
      <button class="tab" type="button" data-view="flow">Flowcharts</button>
      <button class="tab" type="button" data-view="matrix">Matrix</button>
      <button class="tab" type="button" data-view="texts">Contested texts</button>
      <button class="tab" type="button" data-view="spectrum">Spectrums</button>
      <button class="tab" type="button" data-view="sources">Sources</button>
    </nav>
    <div class="scheme"><label>Colours</label><div class="swatches" id="swatches"></div></div>
  </div>
</header>
<main class="wrap">
  <section class="view" id="v-overview"></section>
  <section class="view" id="v-explorer" hidden></section>
  <section class="view" id="v-map" hidden></section>
  <section class="view" id="v-timeline" hidden></section>
  <section class="view" id="v-flow" hidden></section>
  <section class="view" id="v-matrix" hidden></section>
  <section class="view" id="v-texts" hidden></section>
  <section class="view" id="v-spectrum" hidden></section>
  <section class="view" id="v-sources" hidden></section>
</main>
<footer><div class="wrap">Theology Compass is a study aid. It sets traditional doctrines beside their strongest critiques and the defenders' replies; read the sources and test everything (1 Thessalonians 5:21).</div></footer>
<!--/APP-->
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
